name: Keep ShopMind Alive

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours (max gap 4h, well under the ~13h sleep)
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space API (wakes container -> connects to Qdrant)
        run: |
          STATUS=$(curl -L --max-time 120 -s -o /tmp/hf.txt -w "%{http_code}" \
            https://saix11-shopmind-api.hf.space/health)
          echo "HF Space status: $STATUS"
          echo "Body: $(cat /tmp/hf.txt)"
          if [ "$STATUS" = "200" ]; then
            echo "HF Space awake -- Qdrant inactivity timer also reset"
          else
            echo "Warning: HF Space returned $STATUS"
          fi

      # Streamlit Cloud 303-redirects plain curl to an auth gate, so the request
      # never reaches the app and never wakes it. A real browser is required.
      - name: Wake Streamlit (headless browser)
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://shopmind-ai.streamlit.app"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="load", timeout=120_000)

              # If the app is asleep, Streamlit shows a wake-up button.
              try:
                  page.get_by_text("get this app back up", exact=False).click(timeout=15_000)
                  print("App was asleep -- clicked wake button, waiting for boot...")
                  page.wait_for_timeout(45_000)
              except Exception:
                  print("No wake button found -- app was already awake")

              page.wait_for_timeout(10_000)
              print("Final title:", page.title())
              print("Final URL:  ", page.url)
              browser.close()
          PY
